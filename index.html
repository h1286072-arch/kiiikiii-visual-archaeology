<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>打开 KiiiKiii 的美学密码</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #161616;
      --mute: #6b7280;
      --line: #ececec;
      --paper: #ffffff;
      --sky: #9fd4f0;
      --sky-deep: #5ea0c8;
      --mint: #8fbf7a;
      --accent: #0ea5e9;
      --ui-dark: #12141a;
      --ui-panel: #1b1e27;
      --ui-line: #2c3140;
      --ui-text: #e8eaf0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100%;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .hidden { display: none !important; }
    [contenteditable="true"]:focus {
      outline: 2px solid rgba(14,165,233,.45); outline-offset: 3px; border-radius: 4px;
    }

    /* ===== edit chrome ===== */
    .topbar {
      display: none; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 10px 16px; border-bottom: 1px solid var(--ui-line); background: #151821; color: var(--ui-text);
      position: sticky; top: 0; z-index: 40;
    }
    body.edit .topbar { display: flex; }
    .logo { font-weight: 700; font-size: 13px; letter-spacing: 0.04em; }
    .logo span { color: #7dd3fc; }
    .pill {
      font-size: 11px; color: #9fb0c8; border: 1px solid var(--ui-line);
      border-radius: 999px; padding: 6px 10px;
    }
    .pill em { color: #7dd3fc; font-style: normal; }
    .tabs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
    .tab {
      appearance: none; background: #222733; color: var(--ui-text); border: 1px solid var(--ui-line);
      border-radius: 8px; padding: 7px 12px; font-size: 12px;
    }
    .tab:hover { border-color: #4b5568; }
    .tab.active { background: #0ea5e9; border-color: #0ea5e9; color: #041018; font-weight: 600; }
    .tab.ghost { opacity: .9; }
    .tab.danger { background: #3f1d1d; border-color: #7f1d1d; color: #fecaca; }

    body.edit { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr; }
    body.edit .topbar { grid-column: 1 / -1; }
    body.edit .site { grid-column: 1; min-width: 0; }
    .side {
      display: none; border-left: 1px solid var(--ui-line); background: var(--ui-panel);
      padding: 16px; overflow: auto; font-size: 12px; line-height: 1.55; color: #aab3c7;
      position: sticky; top: 52px; height: calc(100vh - 52px);
    }
    body.edit .side { display: block; }
    .side h3 { color: #fff; font-size: 12px; margin: 0 0 10px; letter-spacing: 0.06em; text-transform: uppercase; }
    .side h4 { color: #d6dbe8; font-size: 12px; margin: 16px 0 6px; }
    .side label { display: block; font-size: 11px; color: #9fb0c8; margin: 10px 0 4px; }
    .side input, .side select, .side textarea {
      width: 100%; background: #0f1218; border: 1px solid var(--ui-line);
      color: var(--ui-text); border-radius: 8px; padding: 8px;
    }
    .side textarea { min-height: 90px; resize: vertical; }
    .side .note {
      margin-top: 12px; padding: 10px; border-radius: 10px;
      border: 1px dashed #3a4154; background: #141824; color: #8b92a8;
    }
    .tool-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tool-row .tab { margin: 0; padding: 6px 9px; font-size: 11px; }

    /* ===== site shell ===== */
    .site { min-height: 100vh; background: var(--paper); }
    .fx-nav {
      position: sticky; top: 0; z-index: 30;
      height: 58px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    body.edit .fx-nav { top: 0; }
    .brand {
      font-family: "Instrument Serif", serif; font-size: 22px; font-weight: 400;
      display: flex; align-items: baseline; gap: 8px; cursor: pointer; background: none; border: none; color: inherit;
    }
    .brand small {
      font-family: Inter, sans-serif; font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--mute);
    }
    .nav-links {
      display: flex; gap: 8px; list-style: none; font-size: 13px; color: var(--mute);
      font-family: "Space Grotesk", Inter, sans-serif; flex-wrap: wrap; justify-content: center;
    }
    .nav-links button {
      appearance: none; background: none; border: none; color: inherit;
      font: inherit; padding: 6px 8px; border-radius: 8px;
    }
    .nav-links button:hover { color: var(--ink); background: #f5f8fb; }
    .nav-links button.on { color: var(--ink); font-weight: 600; }
    .duty {
      font-family: "Space Grotesk", sans-serif;
      background: var(--mint); color: #fff; border-radius: 999px; border: none;
      padding: 8px 14px; font-size: 12px; font-weight: 600;
      box-shadow: 0 6px 16px rgba(143,191,122,.28);
      text-decoration: none; display: inline-flex; align-items: center;
    }

    .view { display: none; }
    .view.active { display: block; }

    /* ===== HOME ===== */
    .home-hero {
      position: relative; min-height: calc(100vh - 58px);
      overflow: hidden; padding: 48px 6vw 80px;
    }
    .skyband {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 50% 80% at 70% 28%, rgba(255,255,255,.75), transparent 60%),
        linear-gradient(180deg, #b9e4f8 0%, #d7f0fa 42%, #fff 78%);
      pointer-events: none;
    }
    .home-grid {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: minmax(280px, 1fr) minmax(300px, 1.05fr);
      gap: 36px; align-items: start; max-width: 1180px; margin: 0 auto;
    }
    .home-copy .tag {
      display: inline-flex; align-items: center; font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; border: 1px solid #dbeafe; background: #eff8ff; color: var(--sky-deep);
      border-radius: 999px; padding: 4px 10px; font-family: "Space Grotesk", sans-serif; margin-bottom: 18px;
    }
    .home-copy h1 {
      font-family: "Instrument Serif", serif; font-size: clamp(40px, 5.5vw, 64px);
      line-height: 1.05; letter-spacing: -0.02em; white-space: pre-wrap; margin-bottom: 16px;
    }
    .home-copy .sub {
      font-size: 14px; color: var(--mute); line-height: 1.5; white-space: pre-wrap; max-width: 360px;
    }
    .album-btns {
      display: grid; gap: 10px; margin-top: 28px; max-width: 360px;
    }
    .album-btn {
      appearance: none; text-align: left; border: 1px solid #e8eef3; background: rgba(255,255,255,.88);
      border-radius: 14px; padding: 14px 16px; box-shadow: 0 12px 28px rgba(40,80,120,.08);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .album-btn:hover { transform: translateY(-2px); border-color: #cfe7f5; box-shadow: 0 16px 34px rgba(40,80,120,.14); }
    .album-btn strong {
      display: block; font-family: "Space Grotesk", sans-serif; font-size: 16px; margin-bottom: 2px;
    }
    .album-btn span { font-size: 12px; color: var(--mute); }

    .home-visual { position: relative; min-height: 420px; }
    .guide-card {
      border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 22px 50px rgba(40,80,120,.18); background: #bcd center/cover no-repeat;
      aspect-ratio: 4/5; max-width: 420px; margin-left: auto; position: relative; cursor: zoom-in;
    }
    .guide-card .badge {
      position: absolute; right: 12px; top: 12px;
      background: rgba(120,180,220,.9); color: #fff; border-radius: 999px;
      padding: 6px 10px; font-size: 11px; font-family: "Space Grotesk", sans-serif;
    }
    .guide-card .cap {
      position: absolute; inset: auto 0 0 0; padding: 14px;
      background: linear-gradient(transparent, rgba(20,40,60,.5));
      color: #fff; font-family: "Space Grotesk", sans-serif;
    }
    .guide-card .cap strong { display: block; font-size: 20px; font-weight: 600; }
    .home-jars {
      display: flex; gap: 14px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap;
    }
    .jar {
      width: 132px; background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 10px;
      box-shadow: 0 16px 36px rgba(20,40,60,.08);
    }
    .jar .pic {
      width: 100%; aspect-ratio: 1; border-radius: 10px; background: center/cover no-repeat #f7f7f7;
      border: 1px solid #f0f0f0; position: relative; overflow: hidden; cursor: zoom-in;
    }
    .jar .pic .lock {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(255,255,255,.35); font-size: 22px;
    }
    .jar .meta { margin-top: 8px; font-family: "Space Grotesk", sans-serif; font-size: 12px; }
    .jar .meta b { display: block; font-size: 13px; margin-bottom: 2px; }
    .jar .price { color: var(--mute); }
    .jar .price::before { content: "◆ "; color: var(--sky-deep); font-size: 10px; }

    .deco-pin, .deco-plate, .deco-cam, .deco-note {
      position: absolute; z-index: 2; pointer-events: none;
    }
    .deco-pin {
      right: -8px; top: 8%; width: 58px; height: 58px; border-radius: 50%;
      border: 3px solid #fff; box-shadow: 0 10px 20px rgba(0,0,0,.12);
      display: grid; place-items: center; font-size: 26px;
      background: conic-gradient(from 20deg, #ff5ea8, #ffd34e, #6ee7b7, #60a5fa, #ff5ea8);
    }
    .deco-plate {
      right: 4%; top: 42%; padding: 10px 8px; text-align: center;
      background: linear-gradient(180deg, #dff7a8, #b6e05a);
      border: 2px solid #fff; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,.1);
      font-family: "Space Grotesk", sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 0.04em; color: #1f3a12; transform: rotate(4deg); white-space: pre-wrap;
    }
    .deco-cam {
      right: 18%; bottom: 6%; width: 64px; height: 54px; border-radius: 8px;
      background: linear-gradient(145deg, #dfe7ef, #9aa8b5); border: 2px solid #fff;
      box-shadow: 0 10px 18px rgba(0,0,0,.12); display: grid; place-items: center;
      font-size: 22px; transform: rotate(-6deg);
    }
    .deco-note {
      left: -4%; bottom: 10%; padding: 10px 8px; background: #c8f071;
      box-shadow: 2px 4px 0 rgba(0,0,0,.08); font-size: 11px; color: #244012;
      transform: rotate(7deg); font-family: "Instrument Serif", serif; white-space: pre-wrap;
    }

    .home-footer {
      position: relative; z-index: 1; max-width: 1180px; margin: 28px auto 0;
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding-top: 18px; border-top: 1px solid rgba(0,0,0,.06); font-size: 11px; color: var(--mute);
    }
    .seals { display: flex; gap: 10px; flex-wrap: wrap; }
    .seal {
      height: 34px; padding: 0 10px; border-radius: 999px; border: 1px solid #e5e5e5;
      background: #fff; display: flex; align-items: center; font-size: 10px; color: #333; font-weight: 600;
    }

    /* ===== gallery pages ===== */
    .page-head {
      padding: 42px 6vw 18px; max-width: 1180px; margin: 0 auto;
    }
    .page-head .eyebrow {
      font-family: "Space Grotesk", sans-serif; font-size: 12px; color: var(--sky-deep);
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px;
    }
    .page-head h1 {
      font-family: "Instrument Serif", serif; font-size: clamp(36px, 5vw, 56px);
      line-height: 1.05; margin-bottom: 12px;
    }
    .page-head .intro {
      max-width: 560px; color: var(--mute); font-size: 15px; line-height: 1.55; white-space: pre-wrap;
    }

    .masonry {
      column-count: 2; column-gap: 18px;
      padding: 10px 6vw 80px; max-width: 1180px; margin: 0 auto;
    }
    @media (min-width: 980px) {
      .masonry { column-count: 3; }
    }
    @media (max-width: 640px) {
      .masonry { column-count: 1; }
      .home-grid { grid-template-columns: 1fr; }
      .nav-links { gap: 2px; font-size: 12px; }
      .fx-nav { padding: 0 14px; }
      .duty { display: none; }
    }
    .shot {
      break-inside: avoid; margin: 0 0 18px;
      border-radius: 12px; overflow: hidden; background: #f3f6f8;
      border: 1px solid #eef2f5; box-shadow: 0 14px 34px rgba(40,80,120,.08);
      cursor: zoom-in; position: relative;
    }
    .shot img, .shot video {
      width: 100%; display: block; vertical-align: top;
    }
    .shot .meta {
      padding: 10px 12px 12px; font-family: "Space Grotesk", sans-serif; font-size: 12px;
      background: #fff;
    }
    .shot .meta strong { display: block; font-size: 14px; margin-bottom: 2px; }
    .shot .meta span { color: var(--mute); }
    .shot.link-card {
      cursor: pointer; padding: 22px; background:
        radial-gradient(circle at 90% 10%, #dff3ff, transparent 45%),
        #fff;
    }
    .shot.link-card strong { font-size: 18px; font-family: "Instrument Serif", serif; }
    .shot .edit-del {
      position: absolute; top: 8px; right: 8px; display: none;
      appearance: none; border: none; background: rgba(0,0,0,.55); color: #fff;
      border-radius: 8px; padding: 4px 8px; font-size: 11px; z-index: 2;
    }
    body.edit .shot .edit-del { display: inline-flex; }

    .section-block {
      max-width: 1180px; margin: 0 auto; padding: 10px 6vw 20px;
    }
    .section-block h2 {
      font-family: "Instrument Serif", serif; font-size: 32px; margin: 28px 0 8px;
    }
    .section-block p { color: var(--mute); max-width: 560px; margin-bottom: 18px; white-space: pre-wrap; }
    .crew-grid, .gear-grid, .nostalgia-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      padding: 0 6vw 40px; max-width: 1180px; margin: 0 auto;
    }
    .person, .gear, .memory {
      border-radius: 14px; overflow: hidden; border: 1px solid #eef2f5; background: #fff;
      box-shadow: 0 14px 34px rgba(40,80,120,.08);
    }
    .person .pic, .gear .pic, .memory .pic {
      aspect-ratio: 4/5; background: center/cover no-repeat #e8eef3; cursor: zoom-in;
    }
    .person .body, .gear .body, .memory .body { padding: 14px; }
    .person .body b, .gear .body b, .memory .body b {
      display: block; font-family: "Space Grotesk", sans-serif; font-size: 16px; margin-bottom: 4px;
    }
    .person .body span, .gear .body span, .memory .body span { color: var(--mute); font-size: 13px; }
    .person a.ig {
      display: inline-flex; margin-top: 10px; font-size: 12px; font-weight: 600;
      color: #fff; background: var(--ink); border-radius: 999px; padding: 7px 12px; text-decoration: none;
    }

    .lightbox {
      position: fixed; inset: 0; z-index: 60; background: rgba(8,12,18,.9);
      display: none; place-items: center; padding: 24px; cursor: zoom-out;
    }
    .lightbox.open { display: grid; }
    .lightbox img, .lightbox video {
      max-width: min(96vw, 1280px); max-height: 90vh; border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    .lightbox .close {
      position: absolute; top: 16px; right: 16px; appearance: none; border: none;
      background: rgba(255,255,255,.12); color: #fff; border-radius: 999px; padding: 8px 14px;
    }
    .toast {
      position: fixed; top: 16px; right: 16px; z-index: 70;
      background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
      padding: 10px 14px; border-radius: 10px; font-size: 12px; display: none;
    }
    .toast.show { display: block; }

    .fab-edit {
      position: fixed; right: 18px; bottom: 18px; z-index: 35;
      appearance: none; border: none; border-radius: 999px;
      background: var(--ink); color: #fff; padding: 12px 16px; font-size: 12px; font-weight: 600;
      box-shadow: 0 12px 28px rgba(0,0,0,.2);
    }
    body.edit .fab-edit { display: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">Kiii<span>Site</span> · Visual Archaeology</div>
    <span class="pill">编辑模式 · 点文字改标题 · 点图可换</span>
    <div class="tabs">
      <button class="tab active" id="btnView" type="button">浏览</button>
      <button class="tab" id="btnEdit" type="button">编辑</button>
      <button class="tab ghost" id="btnSave" type="button">保存</button>
      <button class="tab ghost" id="btnExport" type="button">导出</button>
      <label class="tab ghost" style="display:inline-flex;align-items:center">导入<input id="importFile" type="file" accept="application/json" hidden /></label>
      <button class="tab danger" id="btnReset" type="button">恢复默认</button>
    </div>
    <input id="fileImage" type="file" accept="image/*,.gif,video/mp4,video/webm" hidden />
  </header>

  <div class="site" id="site">
    <header class="fx-nav">
      <button class="brand" type="button" data-go="home">KiiiKiii <small id="brandSmall">Visual Archaeology</small></button>
      <ul class="nav-links" id="navLinks"></ul>
      <a class="duty" id="navDuty" href="https://www.kiiikiii.kr/" target="_blank" rel="noopener">(Girls) Duty Free</a>
    </header>
    <div id="views"></div>
  </div>

  <aside class="side" id="side">
    <h3>当前页</h3>
    <div id="sidePageMeta"></div>
    <h4>媒体</h4>
    <div class="tool-row">
      <button class="tab" type="button" id="btnAddImage">加图片</button>
      <button class="tab" type="button" id="btnAddVideo">加视频/GIF</button>
      <button class="tab" type="button" id="btnAddLink">加链接卡</button>
    </div>
    <div class="note">浏览模式可滚动看图、点击放大。编辑模式可改标题文案，双击图片替换。Web 页支持图片 / 视频 / GIF / 外链。</div>
  </aside>

  <button class="fab-edit" id="fabEdit" type="button">编辑</button>
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" type="button" id="lightboxClose">关闭</button>
    <div id="lightboxBody"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="site-data.js"></script>
  <script src="site-app.js"></script>
</body>
</html>
